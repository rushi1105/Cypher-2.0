services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cypher
      POSTGRES_USER: cypher
      POSTGRES_PASSWORD: cypher
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cypher -d cypher"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CYPHER_ML_ARTIFACT_DIR: /app/ml/artifacts
      DATABASE_URL: postgresql://cypher:cypher@postgres:5432/cypher
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
